name: Convert hero image to WebP

on:
  push:
    branches:
      - main
    paths:
      - frontend/public/images/front.avif
      - .github/workflows/convert-hero-image.yml

permissions:
  contents: write

jobs:
  convert:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Convert AVIF to WebP
        run: |
          ffmpeg -y -i frontend/public/images/front.avif -c:v libwebp -q:v 82 -compression_level 6 frontend/public/images/front.webp

      - name: Commit WebP
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add frontend/public/images/front.webp
          if git diff --cached --quiet; then
            echo "No generated image changes."
            exit 0
          fi
          git commit -m "Add web-compatible hero image"
          git push
